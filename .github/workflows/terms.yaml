name: "Terms"
# An application pull request must accept the module-applications terms: the box in the pull request template, ticked
# in the description. This check fails until it is, and runs again whenever the description is edited.
#
# Adapted from .github/workflows/terms.yaml in https://github.com/anthropics/oss-scanner (Apache-2.0).
#
# pull_request_target, not pull_request: with pull_request the workflow file is taken from the pull request itself, so
# a contributor could edit this check away. This job reads only the event's description, never the pull request's
# code, and gets no token at all. The description reaches the script through an environment variable, never by
# ${{ }} substitution into the script, so its text cannot become shell.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  terms-accepted:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The description accepts the module-applications terms
        env:
          BODY: ${{ github.event.pull_request.body }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          IMAGE_UPDATE_BOT: ${{ vars.IMAGE_UPDATE_BOT }}
          REPO: ${{ github.repository }}
        run: |
          # The repository's own members and its bots (the image update's App too) do not apply through this form.
          if [ -n "$IMAGE_UPDATE_BOT" ] && [ "$AUTHOR" = "$IMAGE_UPDATE_BOT" ]; then
            echo "Opened by the image update ($AUTHOR): no terms box needed."; exit 0
          fi
          case "$ASSOCIATION:$AUTHOR" in
            OWNER:*|MEMBER:*|*:dependabot\[bot\]|*:github-actions\[bot\])
              echo "Opened by $AUTHOR ($ASSOCIATION): no terms box needed."; exit 0 ;;
          esac
          link="https://github.com/${REPO}/blob/main/TERMS.md"
          link=${link//./\\.}
          if printf '%s\n' "$BODY" | grep -qiE "^[[:space:]]*[-*][[:space:]]+\[[xX]\][[:space:]]+I accept the \[module-applications terms\]\(${link}\)"; then
            echo "The module-applications terms are accepted in the description."
          else
            echo "::error::Tick 'I accept the module-applications terms' in the pull request description. Editing the description runs this check again."
            exit 1
          fi
