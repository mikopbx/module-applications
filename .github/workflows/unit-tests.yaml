name: "Unit tests"
# Runs the repository's own tests (pytest) on the pull request's code: the validator, the workflow scripts, the AI
# review's provenance checks. The tests that start MikoPBX in Docker are skipped here (RUN_DOCKER_TESTS); test.yaml
# runs MikoPBX for applications.
#
# pull_request, not pull_request_target: this job runs the pull request's code, so it gets no secret and a read-only
# token, and a pull request from a fork gets nothing more. It is not a required check of applications (an application
# changes no code); maintainers look at it on pull requests that change tools, workflows or rules.

run-name: ${{ github.event.pull_request.title || github.ref_name }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (sha-pinned)
        with:
          persist-credentials: false

      - name: Install the tools' dependencies and pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tools/requirements.txt pytest

      - name: pytest
        run: |
          git config --global user.name "unit-tests"
          git config --global user.email "unit-tests@example.com"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests
